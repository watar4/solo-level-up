<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1430"/>
      <stop offset="1" stop-color="#04070f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Full-bleed background so the icon works as a maskable icon. -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="84" fill="none"
        stroke="#00d4ff" stroke-opacity="0.35" stroke-width="4"/>
  <!-- Double "level up" chevron, kept inside the maskable safe zone. -->
  <g fill="none" stroke="#00d4ff" stroke-width="34" stroke-linecap="round"
     stroke-linejoin="round" filter="url(#glow)">
    <polyline points="152,248 256,150 360,248"/>
    <polyline points="152,362 256,264 360,362"/>
  </g>
</svg>
